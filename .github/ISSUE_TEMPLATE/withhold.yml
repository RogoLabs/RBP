name: Withhold a CVE ID
description: Ask that a row be removed from rbptracker.org. No reason required.
title: "Withhold CVE-"
labels: ["withhold"]
body:
  - type: markdown
    attributes:
      value: |
        **You do not have to tell us why.** A request naming only an ID does not
        distinguish an embargo from a wrong row, and that is deliberate: asking for
        a reason would make the request itself a disclosure.

        The row is withheld on the **next build**, which runs every six hours.

        **If the ID itself is sensitive**, do not file this. A public issue on a
        public repository is a permanent, indexed record that someone wanted this
        ID delisted. Email instead: the address is in
        [`.well-known/security.txt`](https://rbptracker.org/.well-known/security.txt)
        and on the [method page](https://rbptracker.org/method.html).
  - type: input
    id: cve_id
    attributes:
      label: CVE ID
      description: One per line if you have several.
      placeholder: CVE-2026-12345
    validations:
      required: true
  - type: checkboxes
    id: ack
    attributes:
      label: Before you file
      options:
        - label: I understand this issue and its title are public and permanent.
          required: true
