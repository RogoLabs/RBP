name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Feed profile'
        type: choice
        options: [weekly, deep]
        default: weekly
      force_reindex:
        description: 'Force a full 583 MB baseline rebuild'
        type: boolean
        default: false
      min_age_days:
        description: 'Days public before a row is reportable (blank uses the repo variable, then the code default of 7)'
        type: string
        default: ''

env:
  # Precedence: dispatch input, then repository variable RBP_MIN_AGE_DAYS, then
  # the code default. So widening the buffer under CNA pushback is a settings
  # change, not a commit.
  MIN_AGE_DAYS: ${{ inputs.min_age_days || vars.RBP_MIN_AGE_DAYS || '' }}

permissions:
  contents: write      # pushes the grader ledger to the data branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # Durable state, NOT a cache. The grader ledger is the site's
      # accountability record: every owner prediction and its later verdict.
      # Actions caches are evictable, so keeping it there would silently reset
      # the accuracy figure the site publishes.
      - name: Restore durable state
        uses: actions/checkout@v4
        with:
          ref: data
          path: .state

      # The corpus index is derived and reproducible, so a cache is the right
      # home. Only the parquets and the reservation-state cache are cached
      # (roughly 6 MB): the 583 MB baseline zip is deliberately left ephemeral,
      # because caching it would cost more to save and restore than to re-fetch
      # on the rare full rebuild.
      - name: Cache corpus index
        uses: actions/cache@v4
        with:
          path: |
            data/index
            data/.api_cache.json
          key: corpus-index-v2-${{ github.run_id }}
          restore-keys: corpus-index-v2-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed ledger from durable state
        run: |
          mkdir -p data
          if [ -f .state/precision.json ]; then
            cp .state/precision.json data/precision.json
            python -c "import json;d=json.load(open('data/precision.json'));print('grader ledger:',len(d.get('graded',[])),'graded,',len(d.get('predictions',{})),'outstanding')"
          else
            echo "no grader ledger yet, starting fresh"
          fi
          if [ -f .state/resolutions.json ]; then
            cp .state/resolutions.json data/resolutions.json
            python -c "import json;d=json.load(open('data/resolutions.json'));print('resolution ledger:',len(d.get('resolved',[])),'resolved,',len(d.get('open',{})),'tracked')"
          else
            echo "no resolution ledger yet, starting fresh"
          fi
          if [ -d .state/snapshots ]; then
            mkdir -p snapshots && cp -r .state/snapshots/. snapshots/
            echo "restored $(ls snapshots | wc -l) snapshot(s) for the week-over-week diff"
          fi

      - name: Run pipeline
        run: |
          ARGS=(--profile "${{ inputs.profile || 'weekly' }}")
          # Explicit ifs rather than `[ -n "$X" ] && ...`: the AND-OR form does
          # work under `bash -e` (set -e exempts non-final commands in such a
          # list), but that is a rule worth not having to recall when reading a
          # deploy script.
          if [ -n "$MIN_AGE_DAYS" ]; then
            ARGS+=(--min-age-days "$MIN_AGE_DAYS")
          fi
          if [ "${{ inputs.force_reindex }}" = "true" ]; then
            ARGS+=(--reindex)
          fi
          echo "running: rbp.cli run ${ARGS[*]}"
          python -m rbp.cli run "${ARGS[@]}"

      - name: Build site
        run: |
          if [ -f rbp/site.py ]; then
            python -m rbp.cli build --out site
          else
            mkdir -p site && cp placeholder.html site/index.html
          fi
          cp CNAME site/CNAME

      - name: Persist durable state
        run: |
          cp data/precision.json .state/ 2>/dev/null || true
          cp data/resolutions.json .state/ 2>/dev/null || true
          mkdir -p .state/snapshots && cp -r snapshots/. .state/snapshots/ 2>/dev/null || true
          cd .state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -q -m "state: run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
