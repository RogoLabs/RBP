name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # The CVE List baseline is ~583 MB. It NEVER enters the repo (1 GB repo ceiling).
      # 6-hourly runs keep this cache warm, so the 7-day idle eviction never fires.
      - name: Restore CVE List corpus
        uses: actions/cache@v4
        with:
          path: data/corpus
          key: cve-corpus-v1-${{ github.run_id }}
          restore-keys: cve-corpus-v1-

      - name: Install dependencies
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

      # Until the engine lands (PLAN.md phases 0-4) this emits a holding page,
      # so the domain resolves and the deploy path is proven end to end.
      - name: Build site
        run: |
          if [ -d rbp ]; then
            python -m rbp.cli build --out site
          else
            mkdir -p site && cp placeholder.html site/index.html
          fi

      - name: Add custom domain
        run: cp CNAME site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
