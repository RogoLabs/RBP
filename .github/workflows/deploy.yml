name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Feed profile'
        type: choice
        options: [weekly, deep]
        default: weekly
      force_reindex:
        description: 'Force a full 583 MB baseline rebuild'
        type: boolean
        default: false
      min_age_days:
        description: 'Days public before a row is reportable (blank uses the repo variable, then the code default of 7)'
        type: string
        default: ''
      dry_run:
        description: 'Run the pipeline and build the site, publish nothing. Rehearse an epoch, a gate flip or a buffer change against real data.'
        type: boolean
        default: false

env:
  # Precedence: dispatch input, then repository variable RBP_MIN_AGE_DAYS, then
  # the code default. So widening the buffer under CNA pushback is a settings
  # change, not a commit.
  MIN_AGE_DAYS: ${{ inputs.min_age_days || vars.RBP_MIN_AGE_DAYS || '' }}
  # Pre-launch by default: / serves the holding page and the dashboard sits at
  # /overview.html, noindexed. Set the repository variable RBP_LAUNCHED to 1 to
  # make / the dashboard. The gate is 50% CNA coverage (PLAN.md).
  RBP_LAUNCHED: ${{ vars.RBP_LAUNCHED || '' }}
  # Launch epoch, YYYY-MM-DD. Set on launch day to start the count from zero
  # instead of carrying the backlog accumulated while feed coverage was still
  # changing. Keyed on the advisory date, so adding a feed later cannot inflate
  # the count retroactively. Held-back rows stay in the raw data and their count
  # is shown on /method.
  RBP_EPOCH: ${{ vars.RBP_EPOCH || '' }}
  # Incident switch. Set the repository variable RBP_PAUSE to 1 and the pipeline
  # still runs and still reports, but nothing is published and no state advances.
  # There was previously no lever at all: no `if:` on any job, no dry run and no
  # pause, so an unattended tick could not be held while a fix landed.
  RBP_PAUSE: ${{ vars.RBP_PAUSE || '' }}

# Least privilege at the top level. `contents: write` is needed only by the one
# step that pushes the ledger to the data branch, so it is granted per job
# rather than to the whole workflow.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Measured wall times are 6.9 to 14.9 minutes against a 360-minute default,
    # so a hung fetch would otherwise burn six hours and collide with the next
    # scheduled tick.
    timeout-minutes: 45
    permissions:
      contents: write     # the persist step pushes to the data branch
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # Durable state, NOT a cache. The grader ledger is the site's
      # accountability record: every owner prediction and its later verdict.
      # Actions caches are evictable, so keeping it there would silently reset
      # the accuracy figure the site publishes.
      - name: Restore durable state
        uses: actions/checkout@v4
        with:
          ref: data
          path: .state

      # The corpus index is derived and reproducible, so a cache is the right
      # home. Only the parquets and the reservation-state cache are cached
      # (roughly 6 MB): the 583 MB baseline zip is deliberately left ephemeral,
      # because caching it would cost more to save and restore than to re-fetch
      # on the rare full rebuild.
      - name: Cache corpus index
        uses: actions/cache@v4
        with:
          path: |
            data/index
            data/.api_cache.json
          key: corpus-index-v2-${{ github.run_id }}
          restore-keys: corpus-index-v2-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed ledger from durable state
        run: |
          mkdir -p data
          if [ -f .state/precision.json ]; then
            cp .state/precision.json data/precision.json
            python -c "import json;d=json.load(open('data/precision.json'));print('grader ledger:',len(d.get('graded',[])),'graded,',len(d.get('predictions',{})),'outstanding')"
          else
            echo "no grader ledger yet, starting fresh"
          fi
          if [ -f .state/resolutions.json ]; then
            cp .state/resolutions.json data/resolutions.json
            python -c "import json;d=json.load(open('data/resolutions.json'));print('resolution ledger:',len(d.get('resolved',[])),'resolved,',len(d.get('open',{})),'tracked')"
          else
            echo "no resolution ledger yet, starting fresh"
          fi
          if [ -d .state/snapshots ]; then
            mkdir -p snapshots && cp -r .state/snapshots/. snapshots/
            echo "restored $(ls snapshots | wc -l) snapshot(s) for the week-over-week diff"
          fi

      - name: Run pipeline
        env:
          # Without this the pipeline made up to 45 anonymous api.github.com
          # calls per run against a 60/hour shared-runner-IP budget, and a 403
          # from cvelist._releases propagates through ensure_corpus to kill the
          # whole run before any feed is read.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--profile "${{ inputs.profile || 'weekly' }}")
          # Explicit ifs rather than `[ -n "$X" ] && ...`: the AND-OR form does
          # work under `bash -e` (set -e exempts non-final commands in such a
          # list), but that is a rule worth not having to recall when reading a
          # deploy script.
          if [ -n "$MIN_AGE_DAYS" ]; then
            ARGS+=(--min-age-days "$MIN_AGE_DAYS")
          fi
          if [ "${{ inputs.force_reindex }}" = "true" ]; then
            ARGS+=(--reindex)
          fi
          echo "running: rbp.cli run ${ARGS[*]}"
          python -m rbp.cli run "${ARGS[@]}"

      - name: Build site
        run: |
          if [ -f rbp/site.py ]; then
            python -m rbp.cli build --out site
          else
            mkdir -p site && cp placeholder.html site/index.html
          fi
          cp CNAME site/CNAME

      # Upload BEFORE persisting state. A failure in the persist step must
      # not cost the publication too, and state should only advance once the
      # artefact that state describes actually exists.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Always staged, even on a pause or a dry run: staging is local and
      # publishes nothing, and it is what makes a dry run able to show what
      # WOULD go out. Only the push below is gated.
      - name: Stage durable state
        run: |
          cp data/precision.json .state/ 2>/dev/null || true
          cp data/resolutions.json .state/ 2>/dev/null || true
          # Copy only the artefacts that are safe on a world-readable branch.
          # backlog_full.json carries the ungated set, 724 rows including rows
          # inside the buffer and undated ones, 85 of them named. report.md opens
          # "Internal / pre-preview. Do not forward." Neither belongs here.
          mkdir -p .state/snapshots
          for d in snapshots/*/; do
            [ -d "$d" ] || continue
            dst=".state/snapshots/$(basename "$d")"
            mkdir -p "$dst"
            for f in backlog.json backlog.csv cnas.json summary.json held_back.json resolved.json; do
              # Explicit if: a trailing failed test would set the loop's exit
              # status and abort the step under `bash -e`.
              if [ -f "$d$f" ]; then
                cp "$d$f" "$dst/"
              fi
            done
          done
          # Retention. Keep the current snapshot, the previous one and a monthly
          # archive. Without this the branch accumulates every row ever named,
          # including names later withdrawn, four times a day, and no correction
          # on the site can reach the history.
          python -c "
          from rbp.site import prune_snapshots
          d = prune_snapshots('.state/snapshots', keep=2)
          print('pruned %d old snapshot(s): %s' % (len(d), d) if d else 'nothing to prune')
          "
          # Remove anything a previous run published before these rules existed.
          # Note that precision.json sits at the branch ROOT, so a
          # snapshots-scoped rule never touched it: its `predictions` map had
          # 366 CVE-to-CNA name pairs on a public branch, a larger exposure than
          # any snapshot file. The pipeline now only records published rows, but
          # the historical entries have to be pruned here too.
          rm -f .state/snapshots/*/backlog_full.json .state/snapshots/*/report.md
          python - <<'PRUNE'
          import json, os
          # Keep the graded history: that IS the accountability record and it
          # only ever names CNAs whose records have since published, so the
          # assigner is authoritative rather than inferred. Prune the open
          # predictions to the rows the current run actually publishes.
          try:
              pub = {r["cve_id"] for r in json.load(open("snapshots/%s/backlog.json"
                     % sorted(os.listdir("snapshots"))[-1]))}
          except Exception:
              pub = None
          path = ".state/precision.json"
          if pub is not None and os.path.exists(path):
              d = json.load(open(path))
              before = len(d.get("predictions", {}))
              d["predictions"] = {k: v for k, v in d.get("predictions", {}).items()
                                  if k in pub}
              if len(d["predictions"]) != before:
                  json.dump(d, open(path, "w"), indent=1)
                  print("pruned %d unpublished predictions from the ledger"
                        % (before - len(d["predictions"])))
          PRUNE      # Every path that leaves the runner is checked against an allowlist. The
      # protection here used to be a copy loop plus a post-hoc `rm -f` for two
      # filenames, on a branch that deliberately carries no .gitignore, and that
      # branch's own history records a leak in each direction: workflow files
      # that leaked in at creation, and a green state commit that silently
      # dropped every snapshot.
      - name: Check what is about to be published
        run: |
          python - <<'CHECK'
          import glob, json, os, sys
          ALLOWED_ROOT = {"README.md", "precision.json", "resolutions.json"}
          ALLOWED_SNAP = {"backlog.json", "backlog.csv", "cnas.json", "summary.json",
                          "held_back.json", "resolved.json"}
          bad = []
          for path in glob.glob(".state/**/*", recursive=True):
              if os.path.isdir(path) or "/.git/" in path:
                  continue
              rel = os.path.relpath(path, ".state")
              parts = rel.split(os.sep)
              if len(parts) == 1:
                  if rel not in ALLOWED_ROOT:
                      bad.append(f"unexpected file at branch root: {rel}")
              elif parts[0] == "snapshots" and len(parts) == 3:
                  if parts[2] not in ALLOWED_SNAP:
                      bad.append(f"not on the snapshot allowlist: {rel}")
              else:
                  bad.append(f"unexpected path: {rel}")
          # And no published row may name a CNA on a row that is not counted.
          for f in glob.glob(".state/snapshots/*/*.json"):
              try:
                  rows = json.load(open(f))
              except Exception:
                  continue
              if not isinstance(rows, list):
                  continue
              for r in rows:
                  if not isinstance(r, dict):
                      continue
                  named = r.get("owner") not in (None, "", "unattributed")
                  if named and r.get("counted") is False:
                      bad.append(f"{f}: {r.get('cve_id')} names a CNA on an uncounted row")
          if bad:
              print("REFUSING TO PUBLISH:")
              for b in sorted(set(bad))[:40]:
                  print("  " + b)
              sys.exit(1)
          print("publish check passed")
          CHECK

      - name: Persist durable state
        if: ${{ vars.RBP_PAUSE != '1' && inputs.dry_run != true }}
        run: |
          cd .state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -q -m "state: run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:data

  deploy:
    needs: build
    # Held by the incident switch and skipped on a dry run, so a configuration
    # change can be rehearsed against real data without publishing it.
    if: ${{ vars.RBP_PAUSE != '1' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
