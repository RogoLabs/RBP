name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    # NOT minute 0. GitHub's scheduler is heavily oversubscribed on the hour and
    # delivered ticks are chronically late there: 06:47Z and 12:50Z on
    # 2026-08-22, against a schedule asking for 06:00 and 12:00. Two ticks on
    # 2026-08-21 produced nothing at all. Minute 17 is unremarkable and much
    # less contended.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Feed profile'
        type: choice
        options: [weekly, deep]
        default: weekly
      force_reindex:
        description: 'Force a full 583 MB baseline rebuild'
        type: boolean
        default: false
      min_age_days:
        description: 'Days public before a row is reportable (blank uses the repo variable, then the code default of 7)'
        type: string
        default: ''
      dry_run:
        description: 'Run the pipeline and build the site, publish nothing. Rehearse an epoch, a gate flip or a buffer change against real data.'
        type: boolean
        default: false
      fire_drill:
        description: 'Deliberately fail the build to exercise the failure notification. Publishes nothing. Safe: a failed build skips deploy, so the site keeps serving the previous good artefact.'
        type: boolean
        default: false
      rehearse_launch:
        description: 'DRY RUN ONLY. Build the LAUNCHED posture against real data without publishing it. Refused unless dry_run is also true.'
        type: boolean
        default: false
      rehearse_epoch:
        description: 'DRY RUN ONLY. Rehearse an epoch flip (YYYY-MM-DD) without setting the repository variable. Refused unless dry_run is also true.'
        type: string
        default: '' 

env:
  # Precedence: dispatch input, then repository variable RBP_MIN_AGE_DAYS, then
  # the code default. So widening the buffer under CNA pushback is a settings
  # change, not a commit.
  MIN_AGE_DAYS: ${{ inputs.min_age_days || vars.RBP_MIN_AGE_DAYS || '' }}
  # Pre-launch by default: / serves the holding page and the dashboard sits at
  # /overview.html, noindexed. Set the repository variable RBP_LAUNCHED to 1 to
  # make / the dashboard. The gate itself is site.GATE_TOP_N_PCT, deliberately not
  # restated here: this comment said "50% CNA coverage" for the four days after the
  # gate was re-derived onto top-50-by-volume at 80%.
  # A rehearsal override, and it is DRY-RUN ONLY, enforced by a step that fails the
  # job if the two are combined wrongly. Condition 9 asks for the launch state to be
  # rehearsed against real data, and rehearsing it by setting the repository variable
  # would mean going live to find out whether going live works.
  #
  # The override cannot launch the site: `deploy` is skipped on a dry run, so the
  # rehearsal builds the artefact and throws it away. Belt and braces on top of the
  # coverage gate, which already fails closed on the flag.
  RBP_LAUNCHED: ${{ (inputs.dry_run == true && inputs.rehearse_launch == true) && '1' || (vars.RBP_LAUNCHED || '') }}
  # Launch epoch, YYYY-MM-DD. Set on launch day to start the count from zero
  # instead of carrying the backlog accumulated while feed coverage was still
  # changing. Keyed on the advisory date, so adding a feed later cannot inflate
  # the count retroactively. Held-back rows stay in the raw data and their count
  # is shown on /method.
  RBP_EPOCH: ${{ (inputs.dry_run == true && inputs.rehearse_epoch != '') && inputs.rehearse_epoch || (vars.RBP_EPOCH || '') }}
  # THE WITHHOLD LEVER, and it was unreachable in production for four days.
  #
  # /method promises that emailing a CVE ID gets the row removed by a person on the
  # next build. rbp/publish.py reads this list: the site drops those rows before
  # rendering and `publish check` refuses to stage them. Nothing supplied it. The
  # automated writer went with the issue-reading channel on 2026-08-26, nothing
  # replaced it, and `data/` is gitignored and recreated empty on every runner, so
  # the lever read an absent file on every run while every test around it passed.
  #
  # A repository variable rather than a file on the `data` branch, deliberately.
  # That branch is public, so committing the ids there would publish the exact list
  # the lever exists to remove; "counts, never identifiers" is the rule and a git
  # history of removals is identifiers. Comma-separated CVE IDs.
  RBP_WITHHOLD: ${{ vars.RBP_WITHHOLD || '' }}
  # Incident switch. Set the repository variable RBP_PAUSE to 1 and the pipeline
  # still runs and still reports, but nothing is published and no state advances.
  # There was previously no lever at all: no `if:` on any job, no dry run and no
  # pause, so an unattended tick could not be held while a fix landed.
  RBP_PAUSE: ${{ vars.RBP_PAUSE || '' }}

# Least privilege at the top level. `contents: write` is needed only by the one
# step that pushes the ledger to the data branch, so it is granted per job
# rather than to the whole workflow.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The suite gates the deploy. It previously ran only in ci.yml, a separate
  # workflow with no dependency in either direction, so a red ci.yml did not stop
  # a publish and the four scheduled runs a day never invoked pytest at all. At
  # least fourteen review findings end in "add a test", and none of those tests
  # were protecting a scheduled publication.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      # requirements.txt has no pytest; it lives in requirements-dev.txt, which
      # the build job never installed.
      - run: pip install -r requirements-dev.txt
      # tests/render is IGNORED on the publish path, deliberately.
      #
      # PLAN.md 8e: "a browser on the COMMIT path only. Nothing new on the
      # publish path." The render tests skip themselves without Playwright, but a
      # collection-time error in tests/render/conftest.py would still fail this
      # job, and this job gates a four-times-daily publication. So the browser
      # directory is not merely un-run here, it is not collected: a layout suite
      # must not be able to stop the site publishing.
      - run: python -m pytest tests/ -q --ignore=tests/render

  build:
    needs: test
    runs-on: ubuntu-latest
    # Measured wall times are 6.9 to 14.9 minutes against a 360-minute default,
    # so a hung fetch would otherwise burn six hours and collide with the next
    # scheduled tick.
    # 45 -> 60 on 2026-08-29, with the CSAF count cap removed.
    #
    # The 45 was never a law, it was a setting, and rbp/feeds.py's Ubuntu note
    # reasoned from it as though it were fixed ("35 to 44 minutes against a
    # 45-minute job"). GitHub allows up to 360.
    #
    # Measured on the 2026-08-29 build: 31.3 min for everything except csaf
    # (18.4 of it corpus + alas + ubuntu, which spends its configured 900s
    # budget in full, and 9.7 min resolving ids against the reservation oracle).
    # csaf at a 300s per-provider budget costs ~21 min while the four large
    # providers are still catching up, so ~52 min total, falling back to a few
    # minutes once they are caught up.
    #
    # A cancelled job publishes NOTHING: the 16:43Z run hit the old ceiling at
    # 46m9s and deploy never ran. Headroom here is what keeps a slow provider
    # from costing a publication rather than costing some rows.
    timeout-minutes: 60
    env:
      # SCOPED TO THIS JOB, not the workflow.
      #
      # It was in the top-level env block, so it leaked into the `test` job and
      # switched off the very demotion that test_launching_below_gate_fails_closed
      # exists to assert. The rehearsal then failed at `test` with the suite
      # reporting "LAUNCHED, / is the dashboard" from a temp directory, which is the
      # test being told by its environment to expect the opposite of its own point.
      #
      # A lever that changes behaviour must not be visible to the job that verifies
      # that behaviour.
      RBP_REHEARSE: ${{ (inputs.dry_run == true && inputs.rehearse_launch == true) && '1' || '' }}
    permissions:
      contents: write     # the persist step pushes to the data branch
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # The fire drill. Condition 8 requires the notification to have been
      # EXERCISED, not merely written, and a notification nobody has ever seen fire
      # is a notification nobody knows is broken. An on-demand switch beats
      # committing a deliberate bug: it is repeatable, it leaves no bad commit in
      # history, and it fails at the top of the job so nothing downstream runs.
      #
      # Safe by construction. `deploy` is `needs: build` with no `if:`, so a failed
      # build skips the deploy and Pages keeps serving the previous good artefact.
      # Nothing publishes and no state advances.
      # The rehearsal levers exist so nobody has to go live to find out whether
      # going live works. They must never be usable to actually go live, so this
      # refuses the combination rather than quietly ignoring it: silently dropping
      # an override the operator asked for is how a rehearsal gets mistaken for a
      # launch, or a launch for a rehearsal.
      - name: Refuse a rehearsal outside a dry run
        if: ${{ inputs.dry_run != true && (inputs.rehearse_launch == true || inputs.rehearse_epoch != '') }}
        run: |
          echo "::error::rehearse_launch / rehearse_epoch are DRY RUN ONLY."
          echo "Set dry_run=true, or set the repository variables RBP_LAUNCHED /"
          echo "RBP_EPOCH deliberately if you actually intend to launch."
          exit 1

      - name: Fire drill
        if: ${{ inputs.fire_drill == true }}
        run: |
          echo "FIRE DRILL: failing deliberately to exercise the failure notification."
          echo "Nothing publishes. The site keeps serving the previous good build."
          exit 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      # Durable state, NOT a cache. The grader ledger is the site's
      # accountability record: every owner prediction and its later verdict.
      # Actions caches are evictable, so keeping it there would silently reset
      # the accuracy figure the site publishes.
      - name: Restore durable state
        uses: actions/checkout@v5
        with:
          ref: data
          path: .state

      # The corpus index is derived and reproducible, so a cache is the right
      # home. Only the parquets and the reservation-state cache are cached
      # (roughly 6 MB): the 583 MB baseline zip is deliberately left ephemeral,
      # because caching it would cost more to save and restore than to re-fetch
      # on the rare full rebuild.
      - name: Cache corpus index
        uses: actions/cache@v5
        with:
          path: |
            data/index
            data/.api_cache.json
          # Keyed on the parser, not just a version string typed by hand. A
          # restored index has to be one the CURRENT rbp/cvelist.py could have
          # written: the open `corpus-index-v2-` prefix restored the same index
          # after any code change, so a parser fix could not take effect until
          # someone remembered to bump v2 by hand, and a frozen index would be
          # restored on every subsequent run.
          key: corpus-index-${{ hashFiles('rbp/cvelist.py') }}-${{ github.run_id }}
          restore-keys: corpus-index-${{ hashFiles('rbp/cvelist.py') }}-

      # The repo-advisory poller validators, so feed_ghsa_repos re-polls
      # conditionally and a 304 costs no rate-limit quota.
      #
      # A CACHE AND NOT DURABLE STATE, which is a deliberate choice against the
      # obvious one. This file contains CVE IDs by construction, the data branch
      # is public, and `publish.suppressed_ids` states the rule that settles it:
      # counts, never identifiers, because committing ids to a public branch
      # publishes the exact list the withhold lever exists to remove. Scrubbing
      # withheld ids out of the staged copy is not an escape either: the feed
      # reads its rows back from this file, so a scrubbed copy would silently and
      # permanently drop those rows on the next 304.
      #
      # THE COST, stated rather than hidden. An evicted cache is a cold start:
      # about 1,900 requests against a 1,000/hour token, so two runs before the
      # sweep completes, and the feed reports fewer rows until it does. That is
      # disclosed rather than silent, because feed_ghsa_repos records CAPPED with
      # the repo counts and the resume point whenever the sweep does not finish.
      - name: Cache repo-advisory poller state
        uses: actions/cache@v5
        with:
          path: data/ghsa_repos_state.json
          # Rolling: the run id makes every run save a fresh entry, the prefix
          # restores the most recent one. Keyed on the WATCHLIST too, so widening
          # data/ghsa_repos.txt starts a sweep that actually visits the additions
          # rather than restoring a state whose cursor has already passed them.
          key: ghsa-repos-${{ hashFiles('data/ghsa_repos.txt') }}-${{ github.run_id }}
          restore-keys: ghsa-repos-${{ hashFiles('data/ghsa_repos.txt') }}-

      # The CSAF read marks, and this cache is what turns the cap into a
      # backlog. Without it every run is a cold start, `_csaf_plan` reads from
      # the top of every provider, and the site is back to re-fetching 150,000
      # advisories it already knows about.
      #
      # Rolling, exactly like the poller state above: the run id makes each run
      # save a fresh entry and the prefix restores the most recent. Not keyed on
      # anything else, because the provider list living in rbp/feeds.py can grow
      # without invalidating the marks of the providers already read; a NEW
      # provider simply has no entry and starts cold, which is correct.
      #
      # Losing this cache is safe and costs re-reading, which is the behaviour
      # that existed before it. It is not correctness state.
      - name: Cache CSAF read marks
        uses: actions/cache@v5
        with:
          path: data/csaf_state.json
          key: csaf-marks-${{ github.run_id }}
          restore-keys: csaf-marks-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed ledger from durable state
        run: |
          mkdir -p data
          if [ -f .state/precision.json ]; then
            cp .state/precision.json data/precision.json
            python -c "import json;d=json.load(open('data/precision.json'));print('grader ledger:',len(d.get('graded',[])),'graded,',len(d.get('predictions',{})),'outstanding')"
          else
            echo "no grader ledger yet, starting fresh"
          fi
          # The run ledger, so /method can evidence the cadence it claims rather
          # than asserting it. Written by the deploy job of PREVIOUS runs, so it
          # is always one run behind, which is correct: this run has not
          # delivered yet.
          if [ -f .state/runs.jsonl ]; then
            cp .state/runs.jsonl data/runs.jsonl
            echo "run ledger: $(wc -l < data/runs.jsonl) delivered tick(s) recorded"
          else
            echo "no run ledger yet"
          fi
          if [ -f .state/resolutions.json ]; then
            cp .state/resolutions.json data/resolutions.json
            python -c "import json;d=json.load(open('data/resolutions.json'));print('resolution ledger:',len(d.get('resolved',[])),'resolved,',len(d.get('open',{})),'tracked')"
          else
            echo "no resolution ledger yet, starting fresh"
          fi
          if [ -d .state/snapshots ]; then
            mkdir -p snapshots && cp -r .state/snapshots/. snapshots/
            echo "restored $(ls snapshots | wc -l) snapshot(s) for the week-over-week diff"
          fi

      - name: Run pipeline
        env:
          # The withhold channel was removed on 2026-08-26: no secret, no
          # `issues: read`, no API call. See rbp/cli.py.
          # Without this the pipeline made up to 45 anonymous api.github.com
          # calls per run against a 60/hour shared-runner-IP budget, and a 403
          # from cvelist._releases propagates through ensure_corpus to kill the
          # whole run before any feed is read.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--profile "${{ inputs.profile || 'weekly' }}")
          # Explicit ifs rather than `[ -n "$X" ] && ...`: the AND-OR form does
          # work under `bash -e` (set -e exempts non-final commands in such a
          # list), but that is a rule worth not having to recall when reading a
          # deploy script.
          if [ -n "$MIN_AGE_DAYS" ]; then
            ARGS+=(--min-age-days "$MIN_AGE_DAYS")
          fi
          if [ "${{ inputs.force_reindex }}" = "true" ]; then
            ARGS+=(--reindex)
          fi
          echo "running: rbp.cli run ${ARGS[*]}"
          python -m rbp.cli run "${ARGS[@]}"

      # No `if [ -f rbp/site.py ]` fallback. It predated the site builder and could
      # not fire after checkout, so its only effect was to make a missing builder
      # publish a holding page over a live dashboard instead of failing. A build
      # step that silently degrades is the failure mode the launch gate, the
      # degraded banner and the run ledger all exist to prevent.
      - name: Build site
        run: |
          python -m rbp.cli build --out site
          cp CNAME site/CNAME

      # Upload BEFORE persisting state. A failure in the persist step must
      # not cost the publication too, and state should only advance once the
      # artefact that state describes actually exists.
      # include-hidden-files IS LOAD-BEARING, and it defaults to false.
      #
      # v4 of this action added "hidden files (specifically dotfiles) will not be
      # included in the artifact", and it archives with `--exclude=.[^/]*`. This
      # site publishes /.well-known/security.txt, which is RFC 9116 and the one
      # machine-readable place a security team looks for a contact route. Bumping
      # v3 to v5 without this line drops it from the published site, with a green
      # build and no warning: the file stops being served and nothing says so.
      #
      # Caught by reading the v4 release notes before the bump rather than by
      # noticing a 404 later. tests/test_deploy_workflow.py asserts the pairing,
      # so a future bump cannot arrive without it.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      # Always staged, even on a pause or a dry run: staging is local and
      # publishes nothing, and it is what makes a dry run able to show what
      # WOULD go out. Only the push below is gated.
      # Staging, retention and ledger pruning all live in rbp/publish.py.
      # They used to be shell loops and heredocs here, which failed on their
      # first real execution: a YAML block scalar plus an indented heredoc
      # terminator produced `NameError: name 'PRUNE' is not defined`. Logic that
      # gates a publication should also be testable, which shell inside YAML is
      # not. Always runs, even paused, so a dry run can show what would go out.
      - name: Stage durable state
        run: python -m rbp.publish stage --state .state --snapshots snapshots --data data

      # The backstop. Refuses any file off the allowlist, any row naming a CNA
      # on an uncounted row, and any ledger prediction for an unpublished row.
      # Verified against both real leaks: it catches backlog_full.json by path
      # and the held_back.json named row by content, which the path check alone
      # could not, because that file IS allowlisted and its rows were the problem.
      - name: Check what is about to be published
        run: python -m rbp.publish check --state .state

      # Fail LOUD, separately from the publication. site.py already failed
      # closed on the flag and served the pre-launch page, so the site is never
      # frozen by this; the point of the step is that a launch attempted below
      # gate produces a red check instead of silently not launching.
      # Report-only on a rehearsal. The gate exists so an attempted launch below
      # coverage produces a red check rather than silently not launching, and that
      # is right for a real run. On a dry run the whole point is to SEE the launched
      # posture below the gate, so failing here would make the rehearsal impossible
      # and leave launch day as the first execution of the launched code path.
      - name: Launch gate
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m rbp.publish gate --site site ||               echo "::notice::gate not cleared, which is expected on a rehearsal"
          else
            python -m rbp.publish gate --site site
          fi

      # THE ARTEFACT HAS TO HOLD UP, and until 2026-08-30 nothing checked
      # that it did.
      #
      # Three regressions reached the live site on 2026-08-29 and 08-30, each a
      # variant of "state that claims to know something it does not". The
      # offline suite passed on all three. Every one was obvious in the
      # published artefact within seconds, and two of them ran with CISA showing
      # 3 rows instead of 13 while cisagov/CSAF#466 was open and linking to
      # exactly those rows.
      #
      # Detection was never the gap. `feeds.compare_magnitudes` fired on the
      # first one and printed DEGRADED to stdout. Nothing acted on it: no step
      # failed, the site published, and by the next run the shrunken value was
      # the baseline, so the guard went quiet. A finding that reaches only
      # stdout is a finding nobody reads.
      #
      # AFTER the upload and AFTER staging, deliberately, and on the same
      # reasoning the launch gate states: "Fail LOUD, separately from the
      # publication."
      #
      # WHAT THAT ACTUALLY MEANS HERE, because this comment claimed the opposite
      # until 2026-08-31. It used to argue that failing dark on the publication
      # is worse than serving a questionable count with a red build beside it,
      # "because a blocked publication means the site silently keeps serving
      # something older with nothing to say so". The wiring has never done that:
      # `deploy` is `needs: build` with no `if:`, so a finding here fails the
      # build and SKIPS the deploy, exactly as the fire-drill comment further up
      # this file describes. Two comments in one file, each correct about a
      # different thing, and the operator-facing message in verify.py sided with
      # the wrong one.
      #
      # The reasoning it rested on has also stopped applying: "nothing to say so"
      # was true when it was written and is not now. The staleness banner is
      # computed in the browser and fires at 12 and 24 hours precisely because a
      # stopped pipeline cannot recompute anything server-side, so a site that
      # stops getting fresher says so on its own.
      #
      # And the case that made this matter is no longer a failure at all: a
      # shortfall the run already recorded as a failure or a truncation is
      # published with `degraded: true` rather than blocked. See
      # EXPLAINS_A_SHORTFALL in rbp/verify.py. What still blocks is a feed that
      # shrank while reporting itself healthy, which is worth not publishing.
      #
      # Runs on a dry run too: a rehearsal that cannot fail proves nothing.
      - name: Verify the artefact that was just published
        run: python -m rbp.verify --site site --snapshots snapshots

      - name: Persist durable state
        if: ${{ vars.RBP_PAUSE != '1' && inputs.dry_run != true }}
        run: |
          cd .state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -q -m "state: run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:data

  # THE FAILURE NOTIFICATION (review Part 2, condition 8).
  #
  # The pipeline publishes four times a day unattended. Before this, a silent stop
  # looked exactly like a quiet week: the site kept serving the previous artefact
  # with a freshness claim attached, and nothing anywhere said the run had died.
  # GitHub's default behaviour emails the commit author, which does not fire usefully
  # for a cron and is trivially filtered.
  #
  # DEDUPLICATED, because volume is how a notification stops being one. A pipeline
  # broken for two days would otherwise file eight issues, and eight issues from a
  # bot is indistinguishable from noise. One issue per failure EPISODE: opened on the
  # first failure, commented on each subsequent one so the duration is visible, and
  # closed automatically on the next success so the issue list reflects the current
  # state rather than a history of every wobble.
  notify:
    # `deploy` was absent here, so a failed actions/deploy-pages@v5 opened no
    # issue at all: the publication step could fail and the only alarm the
    # project has stayed silent. `timed_out` is matched as well as `failure`,
    # because a deploy that hangs past its 10-minute limit is the same outage.
    #
    # Correction from the review's own cross-examination, recorded so nobody
    # adds it back: matching `cancelled` cannot report a run evicted at queue
    # time, because this job is INSIDE the cancelled run. Only an external
    # heartbeat covers that, and that is the dead-man's switch in runs.jsonl.
    needs: [test, build, deploy]
    if: >-
      always() && (needs.test.result == 'failure' || needs.build.result == 'failure'
      || needs.deploy.result == 'failure' || needs.test.result == 'timed_out'
      || needs.build.result == 'timed_out' || needs.deploy.result == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          # `deploy` was added to this job's triggers and not to its BODY, so a
          # deploy-only failure filed an issue reporting that test and build had
          # both succeeded and saying nothing about the step that actually broke.
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          BODY="The scheduled pipeline failed.

          - test: \`$TEST_RESULT\`
          - build: \`$BUILD_RESULT\`
          - deploy: \`$DEPLOY_RESULT\`
          - trigger: \`$EVENT\`
          - run: $RUN_URL

          The site is still serving the previous good build: nothing publishes and no
          state advances when \`build\` fails, which is deliberate. What is lost is
          freshness, so the count on the site is now older than it claims to be until
          this is fixed.

          This issue closes itself on the next successful run."
          EXISTING=$(gh issue list --repo "$REPO" --state open                        --label pipeline-failure --limit 1 --json number                        --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "commenting on existing failure issue #$EXISTING"
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            echo "opening a new failure issue"
            gh issue create --repo "$REPO" --label pipeline-failure \
              --title "Pipeline failing: scheduled run did not publish" \
              --body "$BODY"
          fi

  # Closes the failure issue once a run succeeds, so the issue list is current state
  # rather than a log of every wobble. Runs on success only, and does nothing when
  # there is no open failure issue.
  recover:
    # Gated on DEPLOY, not just build. This closed the failure issue
    # unconditionally on any green test+build, including a dry run, a paused
    # run, and a run whose deploy had just failed, none of which published
    # anything. The issue body promises "This issue closes itself on the next
    # successful run", so it was closing on runs that were not successful in the
    # only sense a reader cares about.
    needs: [test, build, deploy]
    if: >-
      needs.test.result == 'success' && needs.build.result == 'success'
      && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close the failure issue if one is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "$REPO" --state open                        --label pipeline-failure --limit 1 --json number                        --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            echo "no open failure issue; nothing to close"
            exit 0
          fi
          gh issue comment "$EXISTING" --repo "$REPO" \
            --body "Recovered: $RUN_URL published successfully. Closing."
          gh issue close "$EXISTING" --repo "$REPO"

  deploy:
    needs: build
    # Held by the incident switch and skipped on a dry run, so a configuration
    # change can be rehearsed against real data without publishing it.
    if: ${{ vars.RBP_PAUSE != '1' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      # For the run ledger below, which appends to the data branch.
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # THE RUN LEDGER. Appended as the last step of DEPLOY, not of build.
      #
      # Nothing recorded what was owed. Snapshots are per-date and overwritten
      # four times a day; the failure issue is the only artefact recording a
      # failed tick and `recover` closes it on the next success; and the
      # data-branch git log was the only surviving evidence that two scheduled
      # ticks on 2026-08-21 produced nothing at all.
      #
      # In deploy rather than build because a build that never published is not
      # a delivered tick, and this file is what /method cites when it claims a
      # six-hourly cadence. A claim about cadence needs evidence of cadence.
      #
      # continue-on-error: a bookkeeping append must never be the reason a
      # successful publication reports failure.
      - name: Append to the run ledger
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RBP_CRON: ${{ github.event.schedule }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          git init -q ledger && cd ledger
          # The token goes in the REMOTE URL. GH_TOKEN authenticates the `gh`
          # CLI and does nothing for raw git, so the first real run of this step
          # died with "could not read Username for https://github.com". It was
          # continue-on-error, so the deploy still succeeded and the only
          # evidence was an absent runs.jsonl, which is exactly the silent gap
          # this ledger exists to close.
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY"
          git -c protocol.version=2 fetch -q --depth=1 origin data || true
          git checkout -q -B data FETCH_HEAD 2>/dev/null || git checkout -q -B data
          python3 - <<'PY' >> runs.jsonl
          import json, os, datetime
          print(json.dumps({
              "at": datetime.datetime.now(datetime.timezone.utc)
                    .isoformat(timespec="seconds"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "cron": os.environ.get("RBP_CRON") or "",
              "sha": (os.environ.get("GITHUB_SHA") or "")[:12],
              "conclusion": "success",
              "page_url": os.environ.get("PAGE_URL") or "",
          }))
          PY
          git config user.name "rbp-bot"
          git config user.email "noreply@github.com"
          git add runs.jsonl
          git commit -qm "runs: $GITHUB_RUN_ID" || exit 0
          git push -q origin data


  # THE OTHER HALF OF THE RUN LEDGER: ticks that ran and did not publish.
  #
  # `runs.jsonl` was appended only by `deploy`, and only ever with
  # `conclusion: success`, so a scheduled tick that ran and failed at verify
  # wrote NOTHING AT ALL. From the ledger that is indistinguishable from a tick
  # GitHub never fired, and /status added the two together: it published "18 of
  # 28 scheduled runs published (64.3%)" on 2026-09-02, a figure that reads as
  # this pipeline failing a third of its runs.
  #
  # It was not. 22 of those 28 ticks started and 19 of them published; the other
  # six were GitHub dropping cron under load, which this repository cannot fix
  # and should not be reporting as its own failure. `site.cadence` now splits
  # delivered, failed and unaccounted, and this job is where the middle number
  # comes from.
  #
  # WRITES ONLY WHEN `deploy` DID NOT SUCCEED, so a run appends exactly one
  # ledger line and the two writers can never race each other. The paused and
  # dry-run cases are excluded by the same conditions `deploy` carries: a tick
  # that was deliberately withheld is not a tick that failed, and recording it
  # as one would put this site's own incident switch into its reliability
  # figure.
  ledger:
    needs: [test, build, deploy]
    if: >-
      always() && needs.deploy.result != 'success'
      && vars.RBP_PAUSE != '1' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # continue-on-error for the same reason the delivered-tick append carries
      # it: bookkeeping must never be the reason a run reports a worse outcome
      # than it actually had.
      - name: Append the undelivered tick to the run ledger
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RBP_CRON: ${{ github.event.schedule }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          git init -q ledger && cd ledger
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY"
          git -c protocol.version=2 fetch -q --depth=1 origin data || true
          git checkout -q -B data FETCH_HEAD 2>/dev/null || git checkout -q -B data
          python3 - <<'PY' >> runs.jsonl
          import json, os, datetime
          # WHICH JOB LOST IT, recorded because "did not publish" is the
          # question /status asks and "why" is the question the next person
          # asks. `cadence` reads `conclusion` alone and ignores the rest.
          jobs = {k: os.environ.get(f"{k.upper()}_RESULT") or "unknown"
                  for k in ("test", "build", "deploy")}
          print(json.dumps({
              "at": datetime.datetime.now(datetime.timezone.utc)
                    .isoformat(timespec="seconds"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "cron": os.environ.get("RBP_CRON") or "",
              "sha": (os.environ.get("GITHUB_SHA") or "")[:12],
              "conclusion": "failure",
              "jobs": jobs,
              "page_url": "",
          }))
          PY
          git config user.name "rbp-bot"
          git config user.email "noreply@github.com"
          git add runs.jsonl
          git commit -qm "runs: $GITHUB_RUN_ID did not publish" || exit 0
          git push -q origin data
