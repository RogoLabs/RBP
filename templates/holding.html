<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RBP Tracker</title>
<!-- The only page anyone can reach pre-launch, and it unfurled as a bare link.
     Unfurlers do not read robots.txt, so a paste into Slack or Teams renders
     whatever is here. Deliberately carries no count: the launch gate is on
     promotion, and an unfurl in someone else's channel is promotion. -->
<meta name="description" content="Reserved but Public is the CVE Program's own term for a CVE ID that is reserved, referenced in a public advisory, and still unpublished. This tracker is being built.">
<meta property="og:title" content="Reserved, public, and unpublished">
<meta property="og:description" content="Reserved but Public is the CVE Program's own term for a CVE ID that is reserved, referenced publicly, and still unpublished. This tracker is being built and is not yet published.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rbptracker.org/">
<link rel="canonical" href="https://rbptracker.org/">
<style>
:root{--bg:#f5f7f9;--fg:#0f151b;--mut:#4e5966;--acc:#0b6b72;--rule:#d8dee5}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f13;--fg:#e4eaf1;--mut:#95a2b1;--acc:#48acb3;--rule:#26313c}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
padding:32px;font:16px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:56ch}
h1{font-size:clamp(26px,5vw,40px);line-height:1.1;letter-spacing:-.025em;margin:0 0 20px;text-wrap:balance}
h1 span{color:var(--acc)}
p{color:var(--mut);margin:0 0 14px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;
background:color-mix(in srgb,var(--fg) 8%,transparent);padding:.15em .4em;border-radius:3px}
blockquote{margin:0 0 14px;padding:0 0 0 14px;border-left:2px solid var(--rule);color:var(--mut)}
footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);
font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.05em;color:var(--mut)}
a{color:var(--acc)}
</style>
<main>
  <h1>Reserved, public, and <span>unpublished</span>.</h1>
{% include "_about-copy.html" %}
  <footer>rbptracker.org, soon &middot; <a href="https://github.com/RogoLabs/RBP">RogoLabs/RBP</a></footer>
</main>
